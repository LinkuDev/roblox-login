[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roblox-login"
version = "0.1.0"
description = "Automation-as-a-Service platform: account services, captcha solving, points billing"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.3",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "typer>=0.12",
    "botasaurus>=4.0.14",
    "botasaurus-driver>=4.0.0",
]

[project.optional-dependencies]
worker = ["redis>=5.0", "rq>=1.16"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.2", "pytest-mock>=3.14", "ruff>=0.4", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
rlx = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
